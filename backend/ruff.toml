# Nexora 后端 Ruff 配置。
#
# 取舍说明：本项目有约 3.8 万行存量代码，一次性开启全部规则会产生 800+ 条告警，
# 那样的 CI 只会被人忽略。这里只启用**能抓到真实错误**的规则集，让 CI 立刻可用，
# 纯风格债（导入排序、注解现代化等）留给后续任务分批收敛，不在这里阻塞合并。

target-version = "py313"
line-length = 120

[lint]
# F  = pyflakes：未定义名 / 未使用变量 / 重复定义 / 语法问题 —— 都会真实出错
# E9 = 运行时错误类（E902 IO 错误等）
select = ["F", "E9"]

ignore = [
    # 未使用导入（存量 111 处）。纯清理项，不阻断 CI；建议后续用
    # `ruff check --select F401 --fix` 单独一次性清理并单独提交。
    "F401",
]

[lint.per-file-ignores]
# SQLAlchemy 的 `Mapped["Workspace"]` 是「字符串前向引用」，用于避免模型之间的
# 循环导入，属官方推荐写法。ruff 无法解析这类字符串注解，会对 models 层误报 F821。
"app/models/*.py" = ["F821"]
# 测试里常有意保留未使用的局部变量以提升可读性
"tests/*.py" = ["F841"]
