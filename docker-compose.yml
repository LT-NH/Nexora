# Nexora — one-click infrastructure.
#   docker compose up --build
#
# Stack: PostgreSQL 16 (primary store) + Redis 7 (rate limit/cache/queue)
#        + FastAPI backend + Vite-preview frontend.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      # 强制外部注入：`:?` 在变量缺失时直接让 compose 报错退出。
      # 此前是明文默认值 nexora，「忘记改」就会以弱口令上线。
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: nexora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://nexora:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexora"
      REDIS_URL: redis://redis:6379/0
      # 同样强制注入：弱默认密钥 = JWT 可被离线伪造
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required (generate a strong random value)}"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      SITE_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Persistent uploads/data (e.g. SQLite fallback, backups).
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - frontend_dist:/app/dist

  # ── 可观测性（可选）：docker compose --profile monitoring up -d ──────────
  # 指标源：backend 的 /metrics（prometheus-client）
  # 面板：Grafana 预置「Nexora 后端可观测性」，导入 deploy/monitoring/grafana-dashboard.json
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-nexora}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/nexora.json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  frontend_dist:
  prometheus_data:
  grafana_data:
