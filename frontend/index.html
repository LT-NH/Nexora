<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 图标：ico 兜底旧浏览器，32/192/512 供现代浏览器与 PWA 使用 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexora — 一个面板，管理全部电商渠道。连接 Shopify、抖音、淘宝等平台，订单自动汇聚，千问 AI 深度分析。" />
    <meta name="theme-color" content="#7c3aed" />
    <!-- Open Graph / 社交分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexora" />
    <meta property="og:title" content="Nexora — 一个面板，管理全部电商渠道" />
    <meta property="og:description" content="连接 Shopify、抖音、淘宝等平台，订单自动汇聚，千问 AI 深度分析。14 天免费试用，无需信用卡。" />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexora — 一个面板，管理全部电商渠道" />
    <meta name="twitter:description" content="连接 Shopify、抖音、淘宝等平台，订单自动汇聚，千问 AI 深度分析。" />
    <meta name="twitter:image" content="/og.jpg" />
    <title>Nexora — 一个面板，管理全部电商渠道</title>
    <script>
      (function() {
        var theme = localStorage.getItem('nexora-theme') || 'light';
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <!-- Plus Jakarta Sans 已自托管（src/index.css @font-face），不再依赖 Google Fonts -->
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
